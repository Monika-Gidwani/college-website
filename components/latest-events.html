<!-- ===================================================

=================================================== -->
<section class="levents-section" id="latest-events" aria-label="Latest Events">
    <div class="levents-container">

        <!-- Section heading -->
        <div class="levents-heading">
            <h2 class="levents-title">Latest Events</h2>

            <p class="levents-subtitle">Showcasing the Latest Events, Achievements, and Milestones</p>

        <!-- Carousel wrapper -->
        <div class="levents-carousel" id="leventsCarousel">

            <!-- Track -->
            <div class="levents-track-wrap">
                <div class="levents-track" id="leventsTrack">

                    <!-- Card 1 -->
                    <article class="levent-card">
                        <a href="#" class="levent-card__link" aria-label="Orientation Programme">
                            <div class="levent-card__img levent-card__img--1" role="img"
                                aria-label="Orientation Programme photo"></div>

                                <h3 class="levent-card__title">Orientation Programme</h3>
                            </div>
                        </a>
                    </article>

                    <!-- Card 2 -->
                    <article class="levent-card">
                        <a href="#" class="levent-card__link" aria-label="Rangavardhan 2025-26 Cultural Festival">

                                aria-label="Rangavardhan Cultural Festival photo"></div>

                                <span class="levent-card__date">December 2025</span>
                                <h3 class="levent-card__title">Rangavardhan 2025-26 Cultural Festival</h3>
                            </div>
                        </a>
                    </article>

                    <!-- Card 3 -->
                    <article class="levent-card">
                        <a href="#" class="levent-card__link" aria-label="National HR Summit">
                            <div class="levent-card__img levent-card__img--3" role="img"
                                aria-label="National HR Summit photo"></div>
                            <div class="levent-card__strip">
                                <span class="levent-card__date">10 March 2026</span>
                                <h3 class="levent-card__title">National HR Summit</h3>
                            </div>
                        </a>
                    </article>

                    <!-- Card 4 -->
                    <article class="levent-card">
                        <a href="#" class="levent-card__link" aria-label="Alumni Connect Meet 2026">

                                <h3 class="levent-card__title">Alumni Connect Meet 2026</h3>
                            </div>
                        </a>

                    <!-- Card 5 -->
                    <article class="levent-card">
                        <a href="#" class="levent-card__link" aria-label="Industry Guest Lecture">
                            <div class="levent-card__img levent-card__img--5" role="img"

                            </div>

                </div><!-- /levents-track -->
            </div><!-- /levents-track-wrap -->

            <!-- Prev / Next arrows -->
            <button class="levents-btn levents-btn--prev" id="leventsPrev"
                aria-label="Previous event slide">&#10094;</button>
            <button class="levents-btn levents-btn--next" id="leventsNext"
                aria-label="Next event slide">&#10095;</button>

        </div><!-- /levents-carousel -->

        <!-- Dot indicators -->
        <div class="levents-dots" id="leventsDots" role="tablist" aria-label="Event slide indicators"></div>

    </div><!-- /levents-container -->
</section>

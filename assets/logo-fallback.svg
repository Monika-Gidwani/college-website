<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="98" fill="#4A2C17" />
  <circle cx="100" cy="100" r="92" fill="#E8D4B5" />
  <circle cx="100" cy="100" r="88" fill="#4A2C17" />
  <circle cx="100" cy="100" r="82" fill="#E8D4B5" />

  <!-- Book icon (open book) -->
  <rect x="60" y="86" width="38" height="30" rx="3" fill="#4A2C17" />
  <rect x="102" y="86" width="38" height="30" rx="3" fill="#4A2C17" />
  <rect x="96" y="82" width="8" height="38" rx="2" fill="#7A4E2D" />

  <!-- Lines on pages -->
  <line x1="66" y1="95" x2="92" y2="95" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="101" x2="92" y2="101" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="107" x2="92" y2="107" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="95" x2="134" y2="95" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="101" x2="134" y2="101" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="107" x2="134" y2="107" stroke="#E8D4B5" stroke-width="2" stroke-linecap="round"/>

  <!-- Lamp / torch above book -->
  <polygon points="100,48 92,68 108,68" fill="#D4A017" />
  <rect x="93" y="68" width="14" height="10" rx="2" fill="#D4A017" />
  <ellipse cx="100" cy="50" rx="10" ry="8" fill="#D4A017" opacity="0.7" />
  <!-- Flame glow -->
  <ellipse cx="100" cy="50" rx="5" ry="4" fill="#FFDD44" />

  <!-- Stars decoration -->
  <text x="58" y="78" font-size="10" fill="#D4A017" font-family="serif">★</text>
  <text x="130" y="78" font-size="10" fill="#D4A017" font-family="serif">★</text>

  <!-- Initials text -->
  <text x="100" y="146" font-size="18" font-weight="bold" font-family="Georgia,serif"
        fill="#4A2C17" text-anchor="middle" letter-spacing="3">HNCM</text>
  <text x="100" y="162" font-size="9" font-family="Arial,sans-serif"
        fill="#7A4E2D" text-anchor="middle" letter-spacing="1">SOLAPUR</text>

  <!-- Bottom decorative arc text area border -->
  <path d="M 34 138 A 70 70 0 0 0 166 138" fill="none" stroke="#D4A017" stroke-width="1.5"/>
  <path d="M 26 130 A 78 78 0 0 0 174 130" fill="none" stroke="#4A2C17" stroke-width="0.8" opacity="0.4"/>
</svg>

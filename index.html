<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Hirachand Nemchand College of Commerce, Solapur – Autonomous College | NAAC Re-accredited 'A' Grade" />
    <meta name="keywords" content="HN College Management Solapur, MBA, BBA, Autonomous College, NAAC" />
    <title>HN College of Management, Solapur</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Stylesheets (split by concern) -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/events.css" />
    <link rel="stylesheet" href="css/placement.css" />
    <link rel="stylesheet" href="css/components.css" />
</head>

<body>

    <!-- ── Component placeholders ── -->
    <div id="header"></div>
    <div id="navbar"></div>

    <!-- ── Homepage: grid layout (slider stays inline for CSS Grid integrity) ── -->
    <main class="main-content" id="home">
        <div class="homepage-grid">

            <!-- Left: Hero Image Slider (structural — stays in index.html) -->
            <section class="slider-panel" aria-label="Campus Image Slideshow">
                <div class="slider" id="slider">

                    <div class="slides-wrapper" id="slidesWrapper">

                        <div class="slide slide--active" role="img" aria-label="Welcome to HN College of Management">
                            <div class="slide-bg slide-bg--1"></div>
                            <div class="slide-caption">
                                <h2 class="slide-caption__title">Welcome to HN College of Management</h2>
                                <p class="slide-caption__sub">Excellence in Management Education Since 1988</p>
                            </div>
                        </div>

                        <div class="slide" role="img" aria-label="Academic Excellence">
                            <div class="slide-bg slide-bg--2"></div>
                            <div class="slide-caption">
                                <h2 class="slide-caption__title">Shaping Future Business Leaders</h2>
                                <p class="slide-caption__sub">MBA &amp; BBA Programs — Approved, Affiliated &amp;
                                    Autonomous</p>
                            </div>
                        </div>

                        <div class="slide" role="img" aria-label="NAAC Accreditation">
                            <div class="slide-bg slide-bg--3"></div>
                            <div class="slide-caption">
                                <h2 class="slide-caption__title">NAAC Re-accredited 'A' Grade</h2>
                                <p class="slide-caption__sub">Commitment to Quality Education &amp; Research</p>
                            </div>
                        </div>

                    </div><!-- /slides-wrapper -->

                    <button class="slider-btn slider-btn--prev" id="sliderPrev"
                        aria-label="Previous slide">&#10094;</button>
                    <button class="slider-btn slider-btn--next" id="sliderNext"
                        aria-label="Next slide">&#10095;</button>

                    <div class="slider-dots" id="sliderDots" role="tablist" aria-label="Slide indicators"></div>

                </div><!-- /slider -->
            </section>

            <!-- Right: News + Events panel (loaded by loader.js) -->
            <div id="news-panel"></div>

        </div><!-- /homepage-grid -->
    </main>
    <!-- /home -->

    <!-- Latest Events carousel (loaded by loader.js) -->
    <div id="latest-events"></div>

    <!-- Training & Placement Overview (loaded by loader.js) -->
    <div id="placement-overview"></div>

    <!-- Footer (loaded by loader.js) -->
    <div id="footer"></div>

    <!-- Scripts: loader first, then nav and slider logic -->
    <script src="js/loader.js"></script>
    <script src="js/main.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/placement.js"></script>

</body>

</html>
